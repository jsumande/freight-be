services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truck_routing_backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=production-secure-key-sample-replace-in-env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truck_routing_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
