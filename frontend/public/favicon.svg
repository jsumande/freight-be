<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="truckTrailer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#334155" stroke-width="1" />

  <!-- WEATHER ELEMENTS (Upper Region) -->
  <g filter="url(#glow)">
    <!-- Sun behind cloud -->
    <circle cx="43" cy="15" r="5.5" fill="url(#sunGrad)" />
    <!-- Sun Rays -->
    <path d="M43 6.5v2M43 21.5v2M34.5 15h2M49.5 15h2M37 9l1.5 1.5M47.5 19.5l1.5 1.5M37 21l1.5-1.5M47.5 10.5l1.5-1.5" 
          stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round" />

    <!-- Wind Swirls -->
    <path d="M12 14h8a2.5 2.5 0 0 1 2.5-2.5" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.85" />
    <path d="M9 18h11a2.5 2.5 0 0 0 2.5 2.5" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.85" />

    <!-- Weather Cloud -->
    <path d="M 23 23 a 4.5 4.5 0 0 1 7.2 -3.4 A 6.5 6.5 0 0 1 42 19 a 4.8 4.8 0 0 1 3.2 4.4 A 3.8 3.8 0 0 1 42.5 27.5 L 22.5 27.5 A 4 4 0 0 1 23 23 Z" 
          fill="url(#cloudGrad)" />

    <!-- Rain / Precip Drops -->
    <path d="M25 29.5l-1.5 3M32 29.5l-1.5 3M39 29.5l-1.5 3" 
          stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- TRUCK & ROAD ELEMENTS (Lower Region) -->
  <g filter="url(#glow)">
    <!-- Semi-Truck Cargo Trailer -->
    <rect x="10" y="33" width="25" height="15" rx="2" fill="url(#truckTrailer)" />
    <line x1="16" y1="35" x2="16" y2="46" stroke="#0369a1" stroke-width="1" opacity="0.7" />
    <line x1="22" y1="35" x2="22" y2="46" stroke="#0369a1" stroke-width="1" opacity="0.7" />
    <line x1="28" y1="35" x2="28" y2="46" stroke="#0369a1" stroke-width="1" opacity="0.7" />

    <!-- Chassis Coupling -->
    <rect x="34" y="42" width="4" height="4" fill="#64748b" />

    <!-- Semi-Truck Cab -->
    <path d="M37 36.5h7.5l5.5 5.5v6H37z" fill="#f8fafc" />
    <!-- Cab Windshield -->
    <path d="M39 38h4.5l4 4H39z" fill="#0284c7" />
    <!-- Headlight Beam -->
    <rect x="49" y="44" width="2" height="2" rx="0.5" fill="#fef08a" />
    <polygon points="51,44.5 56,43 56,47.5 51,46" fill="#fef08a" opacity="0.25" />

    <!-- Wheels (Tandem rear + front steer) -->
    <!-- Back wheel 1 -->
    <circle cx="16" cy="49" r="3.4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
    <circle cx="16" cy="49" r="1.2" fill="#94a3b8" />
    <!-- Back wheel 2 -->
    <circle cx="26" cy="49" r="3.4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
    <circle cx="26" cy="49" r="1.2" fill="#94a3b8" />
    <!-- Front wheel -->
    <circle cx="44" cy="49" r="3.4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
    <circle cx="44" cy="49" r="1.2" fill="#94a3b8" />

    <!-- Road Base & Highway Centerline -->
    <line x1="7" y1="54" x2="57" y2="54" stroke="#475569" stroke-width="1.6" stroke-linecap="round" />
    <line x1="12" y1="57" x2="52" y2="57" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.8" />
  </g>
</svg>
