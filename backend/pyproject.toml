[project]
name = "backend"
version = "0.1.0"
description = "Weather-Aware Truck Routing Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.15.0",
    "drf-spectacular>=0.30.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "python-dotenv>=1.2.4",
    "requests>=2.31.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
